<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>PROMISES</h1>

    


    <script>



        class customer{
            static welcome(){
                  console.log("Welcome");
                  
            }
        }  

        
        function placeOlder(){
            return new Promise((resolve,reject) =>{
                let stockAvilble=true;

                if(stockAvilble){
                    resolve("order placed successfully")
                }else{
                    reject("out of stack")
                }
            });
        }
    
        customer.welcome()

        placeOlder()
        .then((result)=>console.log(result))
        .then((result)=>console.log("comfirm order"))
        .then((result)=>console.log("process payment"))
        .then((result)=>console.log("ship order"))
        .catch((result)=>console.log(result))

</script>
    
</body>
</html>
